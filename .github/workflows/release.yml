# A tag v* on a commit that is on main builds the APK signed with the release key (secrets KEYSTORE_BASE64, KS_PASS,
# KEY_ALIAS, in the `release` environment) and puts it on the tag's GitHub release. No key, no release: a key made per
# run would stop every update installing. The build has the secrets and can only read; the publish can write and has
# no secrets.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0" "platforms;android-36" > /dev/null
      - run: tools/check.sh
      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::No KEYSTORE_BASE64 secret"; exit 1; fi
          printf %s "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE="$RUNNER_TEMP/release.jks" app/build.sh
          rm "$RUNNER_TEMP/release.jks"
          cp app/build/lampa-native.apk "lampa-native-$GITHUB_REF_NAME.apk"
          sha256sum "lampa-native-$GITHUB_REF_NAME.apk" > "lampa-native-$GITHUB_REF_NAME.apk.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: apk, path: lampa-native-*.apk*, if-no-files-found: error }
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: apk }
      - run: sha256sum -c lampa-native-*.apk.sha256
      - run: gh release create "$GITHUB_REF_NAME" lampa-native-*.apk* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
