# A tag v* builds the APK signed with the release key (repo secrets KEYSTORE_BASE64, KS_PASS, KEY_ALIAS) and puts it
# on the tag's GitHub release. No key, no release: a key made per run would stop every update installing.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0" "platforms;android-36" > /dev/null
      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::No KEYSTORE_BASE64 secret"; exit 1; fi
          printf %s "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE="$RUNNER_TEMP/release.jks" app/build.sh
          cp app/build/lampa-native.apk "lampa-native-$GITHUB_REF_NAME.apk"
          sha256sum "lampa-native-$GITHUB_REF_NAME.apk" > "lampa-native-$GITHUB_REF_NAME.apk.sha256"
      - run: gh release create "$GITHUB_REF_NAME" lampa-native-*.apk* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
